[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "netbalance"
version = "0.1.0"
description = "Educational application-aware TCP load balancer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "matplotlib==3.11.2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "strict"
testpaths = ["tests"]
markers = ["integration"]